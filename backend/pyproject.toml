[project]
name = "upgradejusto-backend"
version = "0.1.0"
description = "Base local del backend de UpgradeJusto"
requires-python = ">=3.12.13,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.156.3",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "httpx2==2.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
