<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>UpgradeJusto</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--papel); color:var(--tinta); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .band { position:absolute; top:0; left:0; width:960px; height:120px; }
  .band svg { display:block; width:960px; height:120px; }
  .pino { fill:var(--pino); }
  .lima { fill:var(--lima); }
  .tinta { fill:var(--tinta); }
  .suave { fill:var(--pino-suave); }
  [data-theme="oscuro"] .suave { fill:var(--tinta-suave); }
  .hueco { fill:var(--papel); }
  .blk { rx:var(--radius-lg); }
  .pill { rx:8px; }
  .pill-l { rx:12px; }
  .words { position:absolute; left:var(--space-7); bottom:var(--space-6); max-width:880px; }
  .name { margin:0; font-family:var(--font-display); font-size:64px; line-height:.95; font-weight:700; letter-spacing:-.025em; color:var(--tinta); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--tinta-suave); font-weight:500; max-width:440px; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../estilos/tokens.css"><link rel="stylesheet" href="../../estilos/componentes.css"></head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 120" width="960" height="120">
<!--
  blocks      pino 400×148 (la marca, el bloque mayor) · lima 152×124 · tinta 240×148 · pino-suave 176×104 (alivio; en oscuro, tinta-suave) — banda superior que sangra por arriba y la derecha
  arrangement tira de bandas desiguales con alturas escalonadas, separadas por space-4, como piezas en una fila de ranuras
  pattern     píldoras, de «Formas blandas: botones, chips y veredictos radius-pill»: cinco píldoras 56×16 a paso space-8 sobre pino en pino-suave, y dos ranuras 96×24 recortadas en tinta con el papel de fondo
  scales      lados en múltiplos de space-4 y space-5; gutters space-4; paso 72 (space-8); esquinas radius-lg en bloques, píldoras con rx = mitad del alto (radius-pill)
-->
<rect class="pino blk" x="-28" y="-28" width="400" height="148" rx="28"/>
<rect class="suave pill" x="24" y="72" width="56" height="16" rx="8"/>
<rect class="suave pill" x="96" y="72" width="56" height="16" rx="8"/>
<rect class="suave pill" x="168" y="72" width="56" height="16" rx="8"/>
<rect class="suave pill" x="240" y="72" width="56" height="16" rx="8"/>
<rect class="lima pill" x="312" y="72" width="40" height="16" rx="8"/>
<rect class="lima blk" x="388" y="-28" width="152" height="124" rx="28"/>
<rect class="tinta blk" x="556" y="-28" width="240" height="148" rx="28"/>
<rect class="hueco pill-l" x="580" y="40" width="96" height="24" rx="12"/>
<rect class="hueco pill-l" x="580" y="76" width="152" height="24" rx="12"/>
<rect class="suave blk" x="812" y="-28" width="176" height="104" rx="28"/>
</svg>
</div>
<div class="words">
  <p class="name">UpgradeJusto</p>
  <p class="tag">Mejorá tu PC sabiendo qué te conviene, cuánto cuesta y si encaja.</p>
</div>
</div>
</body>
</html>
