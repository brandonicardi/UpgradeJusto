<!-- @dsCard group="Asistente" height=700 subtitle="Asistente flotante: abajo a la derecha en cada pantalla" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>AsistenteFlotante</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../estilos/tokens.css"><link rel="stylesheet" href="../../estilos/componentes.css"></head>
<body>
<div class="uj-pad" style="max-width:420px"><p class="uj-muted">El botón «¿Dudas?» queda fijo abajo a la derecha. Probá las sugerencias, escribí algo o cerralo con Escape.</p></div>

<div class="uj-ayuda" id="ayuda">
  <section class="uj-ayuda-panel" id="ayuda-panel" role="dialog" aria-labelledby="ayuda-title">
    <header class="uj-ayuda-head">
      <div><b id="ayuda-title">Asistente</b><small>Sobre: Mi PC · La de casa</small></div>
      <a class="uj-ayuda-icon" href="#" aria-label="Abrir la charla en pantalla completa" title="Abrir en pantalla completa"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></a>
      <button class="uj-ayuda-icon" type="button" id="ayuda-x" aria-label="Cerrar el asistente"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="uj-ayuda-body" id="ayuda-body" aria-live="polite"></div>
    <div class="uj-ayuda-foot">
      <form class="uj-composer" id="ayuda-form"><input id="ayuda-in" placeholder="Escribí tu pregunta" aria-label="Tu pregunta" autocomplete="off"><button class="uj-btn uj-btn-principal uj-btn-chico" aria-label="Enviar"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg></button></form>
      <span class="uj-help">Si algo encaja o no, lo revisamos con reglas fijas. El asistente te lo explica.</span>
    </div>
  </section>
  <button class="uj-ayuda-btn" type="button" id="ayuda-btn" aria-expanded="false" aria-controls="ayuda-panel"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg><span>¿Dudas?</span></button>
</div>
<script>
  // Asistente flotante: respuestas de ejemplo según la pantalla. En la app real responde el asistente con los datos de la PC.
  (function () {
    var CTX = 'Mi PC · La de casa', OPEN = true, QA = [["¿Qué es un lugar M.2?", "Es una ranura corta en la placa madre para discos rápidos que van sin cables. Tu SSD actual ya usa uno."], ["¿Por qué dice «Falta un dato»?", "No sabemos cuántos lugares M.2 tiene tu placa madre. Sin ese dato no podemos decirte si te entra otro disco de ese tipo."], ["¿Qué me conviene mejorar?", "Para jugar, lo que más se nota es la placa de video. En «Lo que te conviene» tenés las opciones con su precio."]];
    var root = document.getElementById('ayuda'), btn = document.getElementById('ayuda-btn'), body = document.getElementById('ayuda-body');
    var inp = document.getElementById('ayuda-in'), started = false, asked = [];
    var ICON_CHAT = btn.querySelector('svg').outerHTML, ICON_X = '<svg class="uj-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var VERDICT = { encaja: '<div><span class="uj-verdict uj-verdict-encaja"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>Encaja</span></div>' };
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function add(html) { var d = document.createElement('div'); d.innerHTML = html; var n = d.firstChild; body.appendChild(n); body.scrollTop = body.scrollHeight; return n; }
    function botHtml(t) { return '<div class="uj-bubble uj-bubble-bot"><div class="uj-bubble-who"><i></i>Asistente</div>' + t + '</div>'; }
    function chips() {
      var left = QA.filter(function (x, i) { return asked.indexOf(i) < 0; });
      if (!left.length) return;
      var c = add('<div class="uj-chips"></div>');
      QA.forEach(function (x, i) {
        if (asked.indexOf(i) > -1) return;
        var b = document.createElement('button'); b.type = 'button'; b.className = 'uj-chip'; b.textContent = x[0];
        b.addEventListener('click', function () { asked.push(i); ask(x[0], x[1] + (x[2] ? VERDICT[x[2]] : '')); });
        c.appendChild(b);
      });
    }
    function ask(q, a) {
      var old = body.querySelector('.uj-chips'); if (old) old.remove();
      add('<div class="uj-bubble uj-bubble-user">' + esc(q) + '</div>');
      var t = add('<div class="uj-typing" aria-label="Escribiendo"><span></span><span></span><span></span></div>');
      setTimeout(function () { t.remove(); add(botHtml(a)); chips(); }, 700);
    }
    function open() {
      root.classList.add('is-open'); btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-label', 'Cerrar el asistente');
      btn.innerHTML = ICON_X + '<span>¿Dudas?</span>';
      if (!started) { started = true; add(botHtml('Hola. Estás en <strong>' + CTX + '</strong>. ¿En qué te ayudo?')); chips(); }
      inp.focus();
    }
    function close() {
      root.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false'); btn.removeAttribute('aria-label');
      btn.innerHTML = ICON_CHAT + '<span>¿Dudas?</span>'; btn.focus();
    }
    btn.addEventListener('click', function () { root.classList.contains('is-open') ? close() : open(); });
    document.getElementById('ayuda-x').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.classList.contains('is-open')) close(); });
    root.querySelector('a.uj-ayuda-icon').addEventListener('click', function (e) { e.preventDefault(); });
    document.getElementById('ayuda-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var q = inp.value.trim(); if (!q) return; inp.value = '';
      ask(q, 'Esto es una vista previa y acá no respondo preguntas libres. En la app te contesto con los datos de tu PC, y si no tengo un dato te lo digo.');
    });
    if (OPEN) open();
  })();
</script>
</body></html>
