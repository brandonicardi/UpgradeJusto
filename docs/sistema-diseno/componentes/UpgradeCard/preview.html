<!-- @dsCard group="Recomendación y plan" height=480 subtitle="La sugerencia principal" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>UpgradeCard</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../estilos/tokens.css"><link rel="stylesheet" href="../../estilos/componentes.css"></head>
<body>
<div class="uj-pad">
  <article class="uj-upgrade">
    <div class="uj-upgrade-head">
      <div><div class="uj-part-kind">Lo que más te conviene</div><h3 class="uj-upgrade-title">Cambiá la placa de video</h3></div>
      <span class="uj-verdict uj-verdict-encaja"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>Encaja</span>
    </div>
    <div class="uj-swap">
      <div class="uj-swap-side"><div class="uj-swap-label">Hoy tenés</div><div class="uj-part-name">GTX 1650 · 4 GB</div></div>
      <svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <div class="uj-swap-side is-new"><div class="uj-swap-label">Pasás a</div><div class="uj-part-name">RTX 4060 · 8 GB</div></div>
    </div>
    <ul class="uj-why">
      <li><svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span>Es el componente que más frena tus juegos hoy.</span></li>
      <li><svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg><span>Tu fuente de 550 W alcanza y entra en tu gabinete.</span></li>
    </ul>
    <div class="uj-upgrade-foot">
      <div class="uj-price">
        <span class="uj-price-amount"><small>ARS</small>$ 389.900</span>
        <span class="uj-price-meta">Te sobran <span class="uj-gain">$ 10.100</span> de tu presupuesto</span>
      </div>
      <div class="uj-row">
        <button class="uj-btn uj-btn-secundario uj-btn-chico">Ver otras opciones</button>
        <button class="uj-btn uj-btn-principal uj-btn-chico">Sumar a mi plan</button>
      </div>
    </div>
  </article>
</div>
</body></html>
