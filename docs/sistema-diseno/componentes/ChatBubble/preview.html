<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ChatBubble</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../estilos/tokens.css"><link rel="stylesheet" href="../../estilos/componentes.css"></head>
<body>
<div class="uj-pad">
  <div class="uj-chat">
    <div class="uj-bubble uj-bubble-user">¿Le puedo poner una RTX 4060 a mi PC?</div>
    <div class="uj-bubble uj-bubble-bot">
      <div class="uj-bubble-who"><i></i>Asistente</div>
      Sí. Revisé tu fuente, tu placa madre y el espacio del gabinete, y entra sin cambiar nada más.
      <div><span class="uj-verdict uj-verdict-encaja"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>Encaja</span></div>
    </div>
    <div class="uj-chips">
      <button class="uj-chip">¿Cuánto me sale?</button>
      <button class="uj-chip">¿Qué otra opción hay?</button>
      <button class="uj-chip">Sumalo a mi plan</button>
    </div>
    <label class="uj-composer"><input placeholder="Preguntá lo que quieras sobre tu PC" aria-label="Mensaje"><button class="uj-btn uj-btn-principal uj-btn-chico" aria-label="Enviar"><svg class="uj-icon" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg></button></label>
  </div>
</div>
</body></html>
