# Levanta la app completa con Docker Compose desde un clon limpio y comprueba que funciona.
name: Docker Compose

on:
  push:
    branches: [main, reorganizacion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arranque:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env como lo haria una persona
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_ADMIN_PASSWORD=.*/POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^UJ_DB_APP_PASSWORD=.*/UJ_DB_APP_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Sin claves, Docker tiene que frenar y avisar
        run: |
          if docker compose --env-file /dev/null config --quiet 2>/dev/null; then
            echo "Compose acepto arrancar sin claves" && exit 1
          fi

      - name: Levantar todo
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: La web responde
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          curl -fsS http://localhost:3000/catalog | grep -q "Cat"

      - name: Solo se publica el puerto 3000
        run: |
          if curl -s --max-time 3 -o /dev/null http://localhost:8000/health; then
            echo "El backend quedo expuesto" && exit 1
          fi

      - name: Catalogo cargado
        run: |
          cuenta() { docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from retail_publications"'; }
          test "$(cuenta)" = "11"
          cuenta > /tmp/antes.txt

      - name: Reiniciar no duplica datos
        run: |
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 180
          cuenta() { docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from retail_publications"'; }
          test "$(cuenta)" = "$(cat /tmp/antes.txt)"

      - name: La web sigue andando despues del reinicio
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/catalog && exit 0
            sleep 2
          done
          exit 1

      - name: Registros si algo fallo
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=120

      - name: Apagar
        if: always()
        run: docker compose down -v
